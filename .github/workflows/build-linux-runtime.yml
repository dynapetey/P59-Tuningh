name: Build Linux Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - "windowsApp/**"
      - "package-linux.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-linux-runtime.yml"
  pull_request:
    paths:
      - "windowsApp/**"
      - "package-linux.sh"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-linux-runtime.yml"

permissions:
  contents: read

jobs:
  linux-runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build and test Linux runtime
        run: ./package-linux.sh

      - name: Upload Linux runtime
        uses: actions/upload-artifact@v4
        with:
          name: P59-Tuner-Linux-x64
          path: dist/linux/P59Tuner-linux-x64.tar.gz
          if-no-files-found: error
