<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P59 Recharts Telemetry Dashboard</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0B0E14',
                        cardBg: '#14171D',
                        borderGrey: '#2C313C',
                        neonGreen: '#00FF87',
                        glowingBlue: '#00D1FF',
                        glowingPurple: '#9E00FF',
                        warningRed: '#FF4E60',
                        amberGold: '#FF9F1C'
                    }
                }
            }
        }
    </script>

    <!-- React, ReactDOM and Babel Standalone for live JSX -->
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/prop-types@15.8.1/prop-types.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.12/babel.min.js" crossorigin></script>
    
    <!-- Recharts UMD -->
    <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js" crossorigin></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0B0E14;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0B0E14;
        }
        ::-webkit-scrollbar-thumb {
            background: #2C313C;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const {
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer
        } = Recharts;

        function App() {
            const [dataHistory, setDataHistory] = useState([]);
            const [currentData, setCurrentData] = useState({
                rpm: 0,
                mph: 0,
                mapKpa: 0,
                coolantTempF: 0,
                sparkAdvance: 0,
                shortTermFuelTrimPercent: 0,
                widebandO2Afr: 14.7,
                throttlePositionPercent: 0,
                massAirFlowGps: 0,
                knockRetardDegrees: 0,
                knockCount: 0,
                manifoldAirTempF: 0,
                desiredIdleRpm: 0,
                iacPositionSteps: 0,
                dwellTimeMs: 0
            });
            
            const [isFrozen, setIsFrozen] = useState(false);
            const [visibleLines, setVisibleLines] = useState({
                rpm: true,
                mapKpa: true,
                sparkAdvance: true,
                knockRetardDegrees: true,
                widebandO2Afr: false
            });

            const [stats, setStats] = useState({
                maxRpm: 0,
                minMap: 100,
                maxMap: 0,
                maxSpark: 0,
                minSpark: 50,
                maxKr: 0,
                knockCountTotal: 0
            });

            // Initialize rolling history with clean default baseline timeline
            useEffect(() => {
                const initial = [];
                const now = new Date();
                for (let i = 40; i >= 0; i--) {
                    const timeStr = new Date(now.getTime() - i * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                    initial.push({
                        time: timeStr,
                        rpm: 0,
                        mph: 0,
                        mapKpa: 30,
                        coolantTempF: 0,
                        sparkAdvance: 0,
                        shortTermFuelTrimPercent: 0,
                        widebandO2Afr: 14.7,
                        throttlePositionPercent: 0,
                        massAirFlowGps: 0,
                        knockRetardDegrees: 0,
                        knockCount: 0,
                        manifoldAirTempF: 0
                    });
                }
                setDataHistory(initial);
            }, []);

            // Set up updater hook on window object for the Android native Webview interface bridge
            useEffect(() => {
                window.updateReactData = (newPoint) => {
                    if (isFrozen) return;
                    
                    setCurrentData(newPoint);
                    
                    setDataHistory(prev => {
                        const updated = [...prev, newPoint];
                        if (updated.length > 50) {
                            updated.shift();
                        }
                        return updated;
                    });

                    setStats(prev => {
                        return {
                            maxRpm: Math.max(prev.maxRpm, newPoint.rpm),
                            minMap: Math.min(prev.minMap, newPoint.mapKpa),
                            maxMap: Math.max(prev.maxMap, newPoint.mapKpa),
                            maxSpark: Math.max(prev.maxSpark, newPoint.sparkAdvance),
                            minSpark: Math.min(prev.minSpark, newPoint.sparkAdvance),
                            maxKr: Math.max(prev.maxKr, newPoint.knockRetardDegrees),
                            knockCountTotal: newPoint.knockCount
                        };
                    });
                };
            }, [isFrozen]);

            const handleLineToggle = (key) => {
                setVisibleLines(prev => ({ ...prev, [key]: !prev[key] }));
            };

            // Calculate auto-normalized values so all metrics are perfectly scalable on a single 0-100% canvas
            const normalizedHistory = useMemo(() => {
                return dataHistory.map(pt => {
                    return {
                        ...pt,
                        rpmNorm: Math.min(100, (pt.rpm / 7000) * 100),
                        mapNorm: Math.min(100, (pt.mapKpa / 120) * 100),
                        sparkNorm: Math.min(100, Math.max(0, ((pt.sparkAdvance + 10) / 60) * 100)), // Maps -10..50 to 0..100
                        krNorm: Math.min(100, (pt.knockRetardDegrees / 10) * 100),
                        afrNorm: Math.min(100, Math.max(0, ((pt.widebandO2Afr - 10) / 8) * 100)) // Maps 10..18 to 0..100
                    };
                });
            }, [dataHistory]);

            // Clear statistics
            const clearStats = () => {
                setStats({
                    maxRpm: currentData.rpm,
                    minMap: currentData.mapKpa,
                    maxMap: currentData.mapKpa,
                    maxSpark: currentData.sparkAdvance,
                    minSpark: currentData.sparkAdvance,
                    maxKr: currentData.knockRetardDegrees,
                    knockCountTotal: currentData.knockCount
                });
            };

            // Custom Tooltip component matching the dark sleek theme
            const CustomTooltip = ({ active, payload }) => {
                if (active && payload && payload.length) {
                    const rawPoint = payload[0].payload;
                    return (
                        <div className="bg-[#14171D] border border-borderGrey p-2.5 rounded-md shadow-2xl text-[10px] font-mono text-slate-300">
                            <div className="text-slate-400 font-extrabold mb-1 border-b border-borderGrey pb-1">{rawPoint.time}</div>
                            <div className="space-y-1">
                                <div className="flex justify-between gap-6">
                                    <span className="text-neonGreen">RPM:</span>
                                    <span className="font-extrabold text-white">{rawPoint.rpm} RPM</span>
                                </div>
                                <div className="flex justify-between gap-6">
                                    <span className="text-glowingBlue">MAP:</span>
                                    <span className="font-extrabold text-white">{rawPoint.mapKpa ? rawPoint.mapKpa.toFixed(1) : '0.0'} kPa</span>
                                </div>
                                <div className="flex justify-between gap-6">
                                    <span className="text-glowingPurple">SPARK:</span>
                                    <span className="font-extrabold text-white">{rawPoint.sparkAdvance ? rawPoint.sparkAdvance.toFixed(1) : '0.0'}°</span>
                                </div>
                                <div className="flex justify-between gap-6">
                                    <span className="text-warningRed">KNOCK:</span>
                                    <span className="font-extrabold text-white">{rawPoint.knockRetardDegrees ? rawPoint.knockRetardDegrees.toFixed(1) : '0.0'}° KR</span>
                                </div>
                                <div className="flex justify-between gap-6">
                                    <span className="text-amberGold">AFR:</span>
                                    <span className="font-extrabold text-white">{rawPoint.widebandO2Afr ? rawPoint.widebandO2Afr.toFixed(2) : '14.7'}</span>
                                </div>
                            </div>
                        </div>
                    );
                }
                return null;
            };

            return (
                <div className="flex flex-col min-h-screen text-slate-100 bg-darkBg p-3">
                    
                    {/* Header Controls */}
                    <div className="flex justify-between items-center border-b border-borderGrey pb-2 mb-3">
                        <div className="flex items-center gap-1.5">
                            <div className="w-1.5 h-1.5 bg-glowingBlue rounded-full shadow-[0_0_8px_#00D1FF]"></div>
                            <span className="text-[10px] font-black tracking-widest text-slate-300 uppercase">RECHARTS ENGINE SENSOR RUN</span>
                        </div>
                        <div className="flex gap-1.5 items-center">
                            <button 
                                onClick={clearStats}
                                className="text-[9px] font-extrabold px-2 py-1 rounded border border-borderGrey bg-cardBg hover:bg-slate-800 text-slate-400"
                            >
                                RESET STATS
                            </button>
                            <button 
                                onClick={() => setIsFrozen(!isFrozen)}
                                className={`text-[9px] font-extrabold px-2.5 py-1 rounded border transition-all ${
                                    isFrozen 
                                    ? 'bg-amberGold/20 border-amberGold text-amberGold' 
                                    : 'bg-cardBg border-borderGrey text-slate-400 hover:bg-slate-800'
                                }`}
                            >
                                {isFrozen ? "▶ RESUME" : "⏸ FREEZE"}
                            </button>
                        </div>
                    </div>

                    {/* Sensor Dash Cards */}
                    <div className="grid grid-cols-2 gap-2 mb-3">
                        
                        {/* RPM Gauge */}
                        <div className="bg-cardBg border border-borderGrey rounded-md p-2 flex flex-col justify-between">
                            <div className="flex justify-between items-center">
                                <span className="text-[8.5px] font-bold text-slate-400">ENGINE SPEED</span>
                                <span className="text-[7.5px] bg-neonGreen/10 text-neonGreen font-mono px-1 rounded">RPM</span>
                            </div>
                            <div className="my-1.5 flex items-baseline">
                                <span className="text-2xl font-black text-neonGreen font-mono tracking-tight">{currentData.rpm}</span>
                                <span className="text-[9px] text-slate-500 font-bold ml-0.5">RPM</span>
                            </div>
                            <div className="text-[8px] text-slate-500 flex justify-between font-mono">
                                <span>MIN: 0</span>
                                <span>MAX: <span className="text-neonGreen">{stats.maxRpm}</span></span>
                            </div>
                        </div>

                        {/* MAP Gauge */}
                        <div className="bg-cardBg border border-borderGrey rounded-md p-2 flex flex-col justify-between">
                            <div className="flex justify-between items-center">
                                <span className="text-[8.5px] font-bold text-slate-400">MANIFOLD PRESSURE</span>
                                <span className="text-[7.5px] bg-glowingBlue/10 text-glowingBlue font-mono px-1 rounded">MAP</span>
                            </div>
                            <div className="my-1.5 flex items-baseline">
                                <span className="text-2xl font-black text-glowingBlue font-mono tracking-tight">
                                    {currentData.mapKpa ? currentData.mapKpa.toFixed(1) : '0.0'}
                                </span>
                                <span className="text-[9px] text-slate-500 font-bold ml-0.5">kPa</span>
                            </div>
                            <div className="text-[8px] text-slate-500 flex justify-between font-mono">
                                <span>MIN: <span className="text-glowingBlue">{stats.minMap === 100 ? '0' : stats.minMap.toFixed(0)}</span></span>
                                <span>MAX: <span className="text-glowingBlue">{stats.maxMap.toFixed(0)}</span></span>
                            </div>
                        </div>

                        {/* Spark Advance Gauge */}
                        <div className="bg-cardBg border border-borderGrey rounded-md p-2 flex flex-col justify-between">
                            <div className="flex justify-between items-center">
                                <span className="text-[8.5px] font-bold text-slate-400">IGNITION ADVANCE</span>
                                <span className="text-[7.5px] bg-glowingPurple/10 text-glowingPurple font-mono px-1 rounded">SPARK</span>
                            </div>
                            <div className="my-1.5 flex items-baseline">
                                <span className="text-2xl font-black text-glowingPurple font-mono tracking-tight">
                                    {currentData.sparkAdvance ? currentData.sparkAdvance.toFixed(1) : '0.0'}
                                </span>
                                <span className="text-[9px] text-slate-500 font-bold ml-0.5">°</span>
                            </div>
                            <div className="text-[8px] text-slate-500 flex justify-between font-mono">
                                <span>MIN: <span className="text-glowingPurple">{stats.minSpark === 50 ? '0' : stats.minSpark.toFixed(0)}</span></span>
                                <span>MAX: <span className="text-glowingPurple">{stats.maxSpark.toFixed(0)}</span></span>
                            </div>
                        </div>

                        {/* Knock Retard Gauge with alert flash */}
                        <div className={`border rounded-md p-2 flex flex-col justify-between transition-all duration-300 ${
                            currentData.knockRetardDegrees > 0 
                            ? 'bg-warningRed/10 border-warningRed shadow-[0_0_10px_rgba(255,78,96,0.15)] animate-pulse' 
                            : 'bg-cardBg border-borderGrey'
                        }`}>
                            <div className="flex justify-between items-center">
                                <span className="text-[8.5px] font-bold text-slate-400">KNOCK RETARD</span>
                                <span className={`text-[7.5px] font-mono px-1 rounded ${
                                    currentData.knockRetardDegrees > 0 ? 'bg-warningRed/20 text-warningRed' : 'bg-slate-800 text-slate-500'
                                }`}>DET</span>
                            </div>
                            <div className="my-1.5 flex items-baseline">
                                <span className={`text-2xl font-black font-mono tracking-tight ${
                                    currentData.knockRetardDegrees > 0 ? 'text-warningRed' : 'text-slate-400'
                                }`}>
                                    {currentData.knockRetardDegrees ? currentData.knockRetardDegrees.toFixed(1) : '0.0'}
                                </span>
                                <span className="text-[9px] text-slate-500 font-bold ml-0.5">° KR</span>
                            </div>
                            <div className="text-[8px] text-slate-500 flex justify-between font-mono">
                                <span>DETONATIONS: <span className="text-warningRed font-bold">{currentData.knockCount}</span></span>
                                <span>MAX: <span className="text-warningRed font-bold">{stats.maxKr.toFixed(1)}</span></span>
                            </div>
                        </div>

                    </div>

                    {/* Recharts Graphical Dashboard Area */}
                    <div className="bg-cardBg border border-borderGrey rounded-md p-2.5 flex-1 flex flex-col min-h-[190px] mb-3">
                        <div className="flex justify-between items-center mb-2">
                            <span className="text-[8.5px] font-extrabold text-slate-400 tracking-wider uppercase">Recharts Time Scale Chrono (50 Seconds)</span>
                            <span className="text-[7.5px] text-slate-500 font-mono">0-100% SCALE</span>
                        </div>
                        
                        <div className="w-full flex-1 min-h-[140px]">
                            <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={normalizedHistory} margin={{ top: 2, right: 2, left: -28, bottom: 2 }}>
                                    <CartesianGrid stroke="#1E293B" strokeDasharray="3 3" vertical={false} />
                                    <XAxis 
                                        dataKey="time" 
                                        stroke="#475569" 
                                        fontSize={7.5} 
                                        tickLine={false}
                                        axisLine={false}
                                    />
                                    <YAxis 
                                        stroke="#475569" 
                                        fontSize={7.5} 
                                        tickLine={false} 
                                        axisLine={false}
                                        domain={[0, 100]}
                                        tickFormatter={(val) => `${val}%`}
                                    />
                                    <Tooltip content={<CustomTooltip />} />
                                    
                                    {visibleLines.rpm && (
                                        <Line 
                                            type="monotone" 
                                            dataKey="rpmNorm" 
                                            name="RPM"
                                            stroke="#00FF87" 
                                            strokeWidth={2} 
                                            dot={false}
                                            activeDot={{ r: 3 }}
                                        />
                                    )}
                                    {visibleLines.mapKpa && (
                                        <Line 
                                            type="monotone" 
                                            dataKey="mapNorm" 
                                            name="MAP"
                                            stroke="#00D1FF" 
                                            strokeWidth={2} 
                                            dot={false}
                                            activeDot={{ r: 3 }}
                                        />
                                    )}
                                    {visibleLines.sparkAdvance && (
                                        <Line 
                                            type="monotone" 
                                            dataKey="sparkNorm" 
                                            name="Spark"
                                            stroke="#9E00FF" 
                                            strokeWidth={2} 
                                            dot={false}
                                            activeDot={{ r: 3 }}
                                        />
                                    )}
                                    {visibleLines.knockRetardDegrees && (
                                        <Line 
                                            type="monotone" 
                                            dataKey="krNorm" 
                                            name="Knock Retard"
                                            stroke="#FF4E60" 
                                            strokeWidth={2.5} 
                                            dot={false}
                                            activeDot={{ r: 4 }}
                                        />
                                    )}
                                    {visibleLines.widebandO2Afr && (
                                        <Line 
                                            type="monotone" 
                                            dataKey="afrNorm" 
                                            name="AFR"
                                            stroke="#FF9F1C" 
                                            strokeWidth={1.5} 
                                            dot={false}
                                            activeDot={{ r: 3 }}
                                        />
                                    )}
                                </LineChart>
                            </ResponsiveContainer>
                        </div>

                        {/* Interactive Series Toggles */}
                        <div className="flex flex-wrap justify-center gap-1.5 mt-2 pt-2 border-t border-slate-800">
                            <button 
                                onClick={() => handleLineToggle('rpm')}
                                className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-all flex items-center gap-1 ${
                                    visibleLines.rpm 
                                    ? 'bg-neonGreen/10 border-neonGreen text-neonGreen' 
                                    : 'bg-slate-800/10 border-borderGrey text-slate-500'
                                }`}
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-neonGreen"></span>
                                RPM
                            </button>
                            <button 
                                onClick={() => handleLineToggle('mapKpa')}
                                className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-all flex items-center gap-1 ${
                                    visibleLines.mapKpa 
                                    ? 'bg-glowingBlue/10 border-glowingBlue text-glowingBlue' 
                                    : 'bg-slate-800/10 border-borderGrey text-slate-500'
                                }`}
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-glowingBlue"></span>
                                MAP
                            </button>
                            <button 
                                onClick={() => handleLineToggle('sparkAdvance')}
                                className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-all flex items-center gap-1 ${
                                    visibleLines.sparkAdvance 
                                    ? 'bg-glowingPurple/10 border-glowingPurple text-glowingPurple' 
                                    : 'bg-slate-800/10 border-borderGrey text-slate-500'
                                }`}
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-glowingPurple"></span>
                                SPARK
                            </button>
                            <button 
                                onClick={() => handleLineToggle('knockRetardDegrees')}
                                className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-all flex items-center gap-1 ${
                                    visibleLines.knockRetardDegrees 
                                    ? 'bg-warningRed/10 border-warningRed text-warningRed' 
                                    : 'bg-slate-800/10 border-borderGrey text-slate-500'
                                }`}
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-warningRed"></span>
                                KR
                            </button>
                            <button 
                                onClick={() => handleLineToggle('widebandO2Afr')}
                                className={`text-[8px] font-bold px-1.5 py-0.5 rounded border transition-all flex items-center gap-1 ${
                                    visibleLines.widebandO2Afr 
                                    ? 'bg-amberGold/10 border-amberGold text-amberGold' 
                                    : 'bg-slate-800/10 border-borderGrey text-slate-500'
                                }`}
                            >
                                <span className="w-1.5 h-1.5 rounded-full bg-amberGold"></span>
                                WBO2 AFR
                            </button>
                        </div>
                    </div>

                    {/* Secondary Telemetry Table Panel */}
                    <div className="grid grid-cols-3 gap-2 text-[8px] font-mono">
                        <div className="bg-cardBg border border-borderGrey rounded-md p-1.5 text-center">
                            <div className="text-slate-500 font-bold mb-0.5">WBO2 AFR</div>
                            <div className="text-amberGold font-black text-xs">
                                {currentData.widebandO2Afr ? currentData.widebandO2Afr.toFixed(2) : '14.70'}
                            </div>
                        </div>
                        <div className="bg-cardBg border border-borderGrey rounded-md p-1.5 text-center">
                            <div className="text-slate-500 font-bold mb-0.5">THROTTLE</div>
                            <div className="text-glowingBlue font-black text-xs">
                                {currentData.throttlePositionPercent}%
                            </div>
                        </div>
                        <div className="bg-cardBg border border-borderGrey rounded-md p-1.5 text-center">
                            <div className="text-slate-500 font-bold mb-0.5">COOLANT/IAT</div>
                            <div className="text-slate-200 font-black text-xs">
                                {currentData.coolantTempF}°F / {currentData.manifoldAirTempF}°F
                            </div>
                        </div>
                    </div>

                </div>
            );
        }

        // Bridge update trigger to listen from Android webViewRef?.evaluateJavascript
        window.updateSensorData = (jsonStr) => {
            try {
                const data = JSON.parse(jsonStr);
                if (window.updateReactData) {
                    window.updateReactData({
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        rpm: data.rpm || 0,
                        mph: data.mph || 0,
                        mapKpa: data.mapKpa || 0,
                        coolantTempF: data.coolantTempF || 0,
                        sparkAdvance: data.sparkAdvance || 0,
                        shortTermFuelTrimPercent: data.shortTermFuelTrimPercent || 0,
                        widebandO2Afr: data.widebandO2Afr || 14.7,
                        throttlePositionPercent: data.throttlePositionPercent || 0,
                        massAirFlowGps: data.massAirFlowGps || 0,
                        knockRetardDegrees: data.knockRetardDegrees || 0,
                        knockCount: data.knockCount || 0,
                        manifoldAirTempF: data.manifoldAirTempF || 0,
                        desiredIdleRpm: data.desiredIdleRpm || 0,
                        iacPositionSteps: data.iacPositionSteps || 0,
                        dwellTimeMs: data.dwellTimeMs || 0
                    });
                }
            } catch(e) {
                console.error("React-Recharts Bridge Parsing error: ", e);
            }
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
